<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- UPI official colors: India flag green/white/orange + UPI brand -->
  <rect width="200" height="80" rx="10" fill="#FFFFFF"/>
  <!-- Top stripe orange -->
  <rect x="0" y="0" width="200" height="8" rx="10" fill="#FF6B00"/>
  <rect x="0" y="0" width="200" height="8" fill="#FF6B00"/>
  <!-- Bottom stripe green -->
  <rect x="0" y="72" width="200" height="8" rx="10" fill="#138808"/>
  <rect x="0" y="72" width="200" height="8" fill="#138808"/>
  <!-- Blue Ashoka wheel accent -->
  <circle cx="32" cy="40" r="18" fill="none" stroke="#000080" stroke-width="2.5"/>
  <circle cx="32" cy="40" r="4" fill="none" stroke="#000080" stroke-width="2"/>
  <line x1="32" y1="22" x2="32" y2="58" stroke="#000080" stroke-width="1.2"/>
  <line x1="14" y1="40" x2="50" y2="40" stroke="#000080" stroke-width="1.2"/>
  <line x1="19.3" y1="27.3" x2="44.7" y2="52.7" stroke="#000080" stroke-width="1.2"/>
  <line x1="44.7" y1="27.3" x2="19.3" y2="52.7" stroke="#000080" stroke-width="1.2"/>
  <!-- UPI text -->
  <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#138808">UPI</text>
  <text x="60" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" fill="#555555">Unified Payments Interface</text>
</svg>
