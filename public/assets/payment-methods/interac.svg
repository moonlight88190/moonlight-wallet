<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Interac - Canada official red/gold -->
  <rect width="200" height="80" rx="10" fill="#F0F4FF"/>
  <!-- Interac logo: stylized "i" in circle + wordmark -->
  <circle cx="32" cy="40" r="22" fill="#F5A623" stroke="none"/>
  <circle cx="32" cy="33" r="3.5" fill="#FFFFFF"/>
  <rect x="29" y="39" width="6" height="15" rx="3" fill="#FFFFFF"/>
  <!-- Wordmark -->
  <text x="64" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#1A1A2E">Interac</text>
  <text x="64" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="11" fill="#444">e-Transfer</text>
  <text x="64" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#888">CAD · Canada Instant</text>
</svg>