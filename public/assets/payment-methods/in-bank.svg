<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Indian bank transfer - saffron/India tricolor -->
  <rect width="200" height="80" rx="10" fill="#0B2A6B"/>
  <!-- Bank pillars icon -->
  <rect x="12" y="52" width="28" height="2.5" rx="1" fill="#FF9933"/>
  <rect x="12" y="25" width="28" height="4" rx="1" fill="#FFFFFF"/>
  <rect x="15" y="29" width="4" height="23" rx="1" fill="#FFFFFF"/>
  <rect x="22" y="29" width="4" height="23" rx="1" fill="#FFFFFF"/>
  <rect x="29" y="29" width="4" height="23" rx="1" fill="#FFFFFF"/>
  <!-- Ashoka wheel small -->
  <circle cx="46" cy="56" r="8" fill="none" stroke="#FF9933" stroke-width="1.5"/>
  <circle cx="46" cy="56" r="2" fill="#FF9933"/>
  <!-- Text -->
  <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Indian Bank Transfer</text>
  <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#93BFFF">IMPS / NEFT</text>
  <text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#7BA8D4">Instant · INR</text>
</svg>
