<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- UPI QR code icon - white background, UPI colors -->
  <rect width="200" height="80" rx="10" fill="#1A1C23"/>
  <!-- QR code icon simplified -->
  <g transform="translate(16, 16)">
    <!-- Outer frame -->
    <rect width="48" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Top-left finder -->
    <rect x="6" y="6" width="14" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="9" y="9" width="8" height="8" rx="1" fill="#FFFFFF"/>
    <!-- Top-right finder -->
    <rect x="28" y="6" width="14" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="31" y="9" width="8" height="8" rx="1" fill="#FFFFFF"/>
    <!-- Bottom-left finder -->
    <rect x="6" y="28" width="14" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="9" y="31" width="8" height="8" rx="1" fill="#FFFFFF"/>
    <!-- Data dots -->
    <rect x="28" y="28" width="4" height="4" rx="0.5" fill="#4ADE80"/>
    <rect x="34" y="28" width="4" height="4" rx="0.5" fill="#4ADE80"/>
    <rect x="40" y="28" width="4" height="4" rx="0.5" fill="#4ADE80"/>
    <rect x="28" y="34" width="4" height="4" rx="0.5" fill="#4ADE80"/>
    <rect x="34" y="34" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
    <rect x="28" y="40" width="4" height="4" rx="0.5" fill="#FFFFFF"/>
    <rect x="40" y="40" width="4" height="4" rx="0.5" fill="#4ADE80"/>
  </g>
  <!-- UPI text -->
  <text x="76" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#4ADE80">UPI QR</text>
  <text x="76" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Scan &amp; Pay</text>
  <text x="76" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#64748B">GPay · PhonePe · Paytm</text>
</svg>
