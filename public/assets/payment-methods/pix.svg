<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Pix - official teal/cyan brand -->
  <rect width="200" height="80" rx="10" fill="#00B5CC"/>
  <!-- Pix key icon (stylized diamond with connecting lines) -->
  <g transform="translate(32,40)">
    <path d="M0,-16 L16,0 L0,16 L-16,0 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0,-16 L0,-24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M16,0 L24,0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,16 L0,24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M-16,0 L-24,0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="65" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" letter-spacing="1">Pix</text>
  <text x="65" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="rgba(255,255,255,0.9)">Brazil · Instant</text>
  <text x="65" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="rgba(255,255,255,0.8)">BRL · Banco Central do Brasil</text>
</svg>