<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Czech QR Platba colors: dark navy -->
  <rect width="200" height="80" rx="10" fill="#11457E"/>
  <!-- Czech flag accent strip -->
  <rect x="0" y="0" width="200" height="5" rx="3" fill="#D7141A"/>
  <!-- QR icon simplified -->
  <rect x="14" y="20" width="20" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="17" y="23" width="5" height="5" fill="#FFFFFF" rx="1"/>
  <rect x="25" y="23" width="5" height="5" fill="#FFFFFF" rx="1"/>
  <rect x="17" y="31" width="5" height="5" fill="#FFFFFF" rx="1"/>
  <rect x="25" y="31" width="5" height="5" fill="#D7141A" rx="1"/>
  <!-- Bank transfer icon -->
  <rect x="14" y="46" width="20" height="14" rx="2" fill="none" stroke="#93BFFF" stroke-width="1.5"/>
  <rect x="16" y="50" width="4" height="8" rx="1" fill="#93BFFF"/>
  <rect x="22" y="50" width="4" height="8" rx="1" fill="#93BFFF"/>
  <rect x="28" y="50" width="4" height="8" rx="1" fill="#93BFFF"/>
  <!-- Text -->
  <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">QR Platba</text>
  <text x="46" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#A0C4FF">Czech Bank Transfer</text>
  <text x="46" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#7BA8D4">Okamžitá platba · CZK</text>
</svg>
