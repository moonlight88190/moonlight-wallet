<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- International SWIFT/Wire – global navy -->
  <rect width="200" height="80" rx="10" fill="#0F1A35"/>
  <!-- Globe icon -->
  <circle cx="32" cy="40" r="20" fill="none" stroke="#4A90D9" stroke-width="2"/>
  <ellipse cx="32" cy="40" rx="10" ry="20" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="14" y1="28" x2="50" y2="28" stroke="#4A90D9" stroke-width="1"/>
  <line x1="14" y1="52" x2="50" y2="52" stroke="#4A90D9" stroke-width="1"/>
  <!-- Text -->
  <text x="62" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">SWIFT / Wire</text>
  <text x="62" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#93C5FD">International Transfer</text>
  <text x="62" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#6B93C4">150+ Countries · 1-2 days</text>
</svg>
