<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- SBI official colors: dark blue background -->
  <rect width="240" height="80" rx="10" fill="#22409A"/>
  <!-- SBI keyhole/lamp logo (official emblem) -->
  <g transform="translate(20, 12)">
    <circle cx="28" cy="20" r="16" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M20 20 A8 8 0 1 1 36 20 L32 56 H24 Z" fill="#FFFFFF"/>
    <circle cx="28" cy="20" r="6" fill="#22409A"/>
    <circle cx="28" cy="20" r="3" fill="#FFFFFF"/>
  </g>
  <!-- SBI wordmark -->
  <text x="72" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" letter-spacing="1">SBI</text>
  <text x="72" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="rgba(255,255,255,0.85)">State Bank of India</text>
  <text x="72" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="rgba(255,255,255,0.65)">The Banker to Every Indian</text>
</svg>