<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- ICICI Bank - orange/red brand -->
  <rect width="240" height="80" rx="10" fill="#FFFFFF"/>
  <!-- ICICI logo: two overlapping orange triangles -->
  <polygon points="22,60 42,60 32,24" fill="#EA5C2C"/>
  <polygon points="28,60 48,60 38,24" fill="#F0A500" opacity="0.85"/>
  <!-- ICICI wordmark -->
  <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#EA5C2C">ICICI</text>
  <text x="60" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#333">Bank</text>
  <text x="95" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" fill="#888">Hum Hain Na</text>
</svg>
