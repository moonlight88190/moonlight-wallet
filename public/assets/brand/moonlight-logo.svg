<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ml-moon" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ml-accent" x1="200" y1="180" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ml-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#ml-bg)"/>
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="140" stroke="url(#ml-moon)" stroke-width="8" stroke-dasharray="12 8" opacity="0.4" />
  <!-- Crescent Moon & M Form -->
  <path d="M 256 116 C 178.68 116 116 178.68 116 256 C 116 333.32 178.68 396 256 396 C 295.66 396 331.35 379.5 356.88 352.88 C 302 350 258 304 258 248 C 258 192 302 146 356.88 143.12 C 331.35 116.5 295.66 116 256 116 Z" fill="url(#ml-moon)" filter="url(#ml-glow)"/>
  <!-- Geometric Moonlight 'M' Overlay -->
  <path d="M 180 320 L 220 200 L 256 250 L 292 200 L 332 320" stroke="url(#ml-accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
