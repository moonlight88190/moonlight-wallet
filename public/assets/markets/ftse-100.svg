<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- FTSE 100 / London Stock Exchange Group Official Vector -->
  <rect width="100" height="100" rx="20" fill="#002447"/>
  <!-- Circular multi-segment badge -->
  <circle cx="50" cy="45" r="24" stroke="#009CDE" stroke-width="4" stroke-dasharray="8 4" fill="none"/>
  <text x="50" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">100</text>
  <text x="50" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#009CDE" letter-spacing="1">FTSE</text>
</svg>
