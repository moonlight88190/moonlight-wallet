<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mlG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crescentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="512" height="512" rx="128" fill="url(#mlG)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#334155" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowG)" filter="url(#glow)"/>

  <!-- Moonlight Crescent & Wallet Concept -->
  <g transform="translate(256, 256)">
    <!-- Crescent Moon -->
    <path d="M 12 -120 A 130 130 0 1 0 130 18 A 100 100 0 1 1 12 -120 Z" fill="url(#crescentG)"/>

    <!-- Stylized Modern M / Ray -->
    <path d="M -70 40 L -20 -50 L 20 -10 L 60 -70 L 80 40" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="60" cy="-70" r="10" fill="#38BDF8"/>
  </g>
</svg>
